# After a merge: packs every mod and publishes them as a release. The game's site fetches the latest one by itself; no
# server's key is here. The only right is this repository's own, to make the release.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test and build the packer
        working-directory: tools/mods_community
        run: cargo test --release --locked && cargo build --release --locked
      - name: Pack
        run: tools/mods_community/target/release/mods-community pack --out out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mods-${GITHUB_RUN_NUMBER}" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Mods ${GITHUB_RUN_NUMBER}" --notes "Packed from ${GITHUB_SHA}."
